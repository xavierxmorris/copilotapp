name: Deploy worktree management demo

on:
  push:
    branches:
      - xavierxmorris-worktree-management-demo
    paths:
      - .github/workflows/worktree-management-demo-pages.yml
      - docs/worktree-management-demo.css
      - docs/worktree-management-demo.html
      - docs/worktree-management-demo.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Stage demo-only site
        shell: bash
        run: |
          mkdir -p _site
          cp docs/worktree-management-demo.html _site/index.html
          cp docs/worktree-management-demo.css _site/
          cp docs/worktree-management-demo.js _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
